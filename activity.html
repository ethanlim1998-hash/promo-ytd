<style>
:root{--paper:#F4F0E8;--card:#FBF9F4;--ink:#211C17;--ink2:#5A5249;
  --line:#D9D1C2;--line2:#C8BEAB;--accent:#9E1B32;
  --shadow:0 1px 2px rgba(33,28,23,.05),0 8px 28px -14px rgba(33,28,23,.20)}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--paper);
  background-image:radial-gradient(circle at 12% -8%,rgba(158,27,50,.06),transparent 42%),
                   radial-gradient(circle at 92% 0%,rgba(46,110,120,.05),transparent 40%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
      padding:34px 38px;max-width:380px;box-shadow:var(--shadow)}
.kick{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.28em;
      text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
h1{font-family:"Fraunces",serif;font-size:26px;font-weight:600;margin:0 0 6px;
   letter-spacing:-.01em;line-height:1.05}
h1 em{font-style:italic;color:var(--accent)}
p{font-size:13px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
input{width:100%;box-sizing:border-box;font-family:"IBM Plex Mono",monospace;
      font-size:14px;padding:10px 12px;border:1px solid var(--line2);
      border-radius:7px;margin-bottom:10px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;font-family:"Archivo",sans-serif;font-weight:600;font-size:14px;
       padding:10px;border:0;border-radius:7px;background:var(--ink);
       color:var(--paper);cursor:pointer}
button:hover{background:var(--accent)}
#err{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-size:11px;
     min-height:16px;margin:8px 0 0}
</style></head><body>

const ITER=310000;
async function unlock(pw){
  const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
    "PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function tryUnlock(pw,remember){
  try{
    const html=await unlock(pw);
    if(remember)sessionStorage.setItem("ytd_pw",pw);
    document.open();document.write(html);document.close();
  }catch(e){
    sessionStorage.removeItem("ytd_pw");
    const el=document.getElementById("err");
    if(el)el.textContent="Wrong password.";
  }
}
document.getElementById("f").addEventListener("submit",ev=>{
  ev.preventDefault();
  tryUnlock(document.getElementById("pw").value,true);
});
const cached=sessionStorage.getItem("ytd_pw");
if(cached)tryUnlock(cached,false);
